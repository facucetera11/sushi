<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizuna Sushi</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
scroll-behavior:smooth;
}

body{
background:#fcfaf6;
color:#16204a;
overflow-x:hidden;
}

/* HEADER */

header{
position:fixed;
top:0;
width:100%;
padding:22px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.9);
backdrop-filter:blur(18px);
z-index:9999;
box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.logo{
font-size:34px;
font-weight:900;
color:#d86a5e;
letter-spacing:4px;
}

nav{
display:flex;
gap:24px;
}

nav a{
text-decoration:none;
font-weight:800;
color:#16204a;
}

/* HERO */

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
url("https://images.unsplash.com/photo-1579871494447-9811cf80d66c");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
text-align:center;
animation:zoomHero 18s infinite alternate ease-in-out;
}

@keyframes zoomHero{
from{background-size:100%;}
to{background-size:115%;}
}

.hero h1{
font-size:90px;
font-weight:900;
}

.hero p{
font-size:24px;
margin-top:15px;
}

/* SECTIONS */

section{
padding:120px 8%;
}

.section-title{
font-size:56px;
font-weight:900;
color:#d86a5e;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:35px;
}

/* CARD */

.card{
background:white;
border-radius:28px;
overflow:hidden;
box-shadow:0 18px 45px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:240px;
object-fit:cover;
}

.content{
padding:24px;
}

.content h3{
font-size:26px;
}

.desc{
opacity:.7;
margin:10px 0;
line-height:1.5;
}

.price{
font-size:24px;
font-weight:900;
color:#d86a5e;
margin:10px 0;
}

.stock-ok{color:#34c759;font-weight:800;}
.stock-low{color:#ff9500;font-weight:800;}
.stock-critical{color:#ff3b30;font-weight:800;}

button{
width:100%;
padding:15px;
border:none;
border-radius:18px;
background:#16204a;
color:white;
font-weight:800;
cursor:pointer;
}

/* CART */

#cart{
position:fixed;
right:20px;
bottom:20px;
width:360px;
background:white;
padding:24px;
border-radius:28px;
box-shadow:0 20px 60px rgba(0,0,0,.15);
max-height:75vh;
overflow:auto;
z-index:999;
}

#badge{
position:fixed;
right:385px;
bottom:340px;
width:46px;
height:46px;
background:#d86a5e;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:900;
z-index:9999;
}

.cart-item{
display:flex;
justify-content:space-between;
margin:12px 0;
}

.qty{
display:flex;
gap:8px;
align-items:center;
}

.qty button{
width:34px;
padding:8px;
}

/* FOOTER */

footer{
background:#16204a;
color:white;
padding:50px;
text-align:center;
margin-top:80px;
}

/* MOBILE */

@media(max-width:768px){

header{
padding:14px 5%;
flex-direction:column;
gap:12px;
}

.logo{
font-size:24px;
}

nav{
flex-wrap:wrap;
justify-content:center;
gap:12px;
}

nav a{
font-size:13px;
}

.hero{
height:75vh;
padding:20px;
}

.hero h1{
font-size:44px;
line-height:1.1;
}

.hero p{
font-size:17px;
}

section{
padding:70px 5%;
}

.section-title{
font-size:32px;
}

.grid{
grid-template-columns:1fr;
gap:22px;
}

.card img{
height:200px;
}

.content h3{
font-size:22px;
}

.desc{
font-size:14px;
}

#cart{
width:92%;
right:4%;
bottom:12px;
padding:16px;
max-height:38vh;
font-size:14px;
border-radius:22px;
}

#badge{
right:18px;
bottom:250px;
width:40px;
height:40px;
font-size:15px;
}

.qty button{
width:28px;
padding:6px;
}

button{
padding:13px;
font-size:14px;
}

}

</style>
</head>
<body>

<header>
<div class="logo">KIZUNA</div>
<nav>
<a href="#rolls">Rolls</a>
<a href="#combos">Combos</a>
<a href="#veggie">Veggie</a>
<a href="#bandejas">Bandejas</a>
<a href="#extras">Extras</a>
</nav>
</header>

<section class="hero">
<h1>KIZUNA SUSHI</h1>
<p>Alta cocina japonesa artesanal</p>
</section>

<section id="rolls"><div class="section-title">Rolls</div><div class="grid" id="rollsGrid"></div></section>
<section id="combos"><div class="section-title">Combos</div><div class="grid" id="combosGrid"></div></section>
<section id="veggie"><div class="section-title">Veggie</div><div class="grid" id="veggieGrid"></div></section>
<section id="bandejas"><div class="section-title">Bandejas</div><div class="grid" id="bandejasGrid"></div></section>
<section id="extras"><div class="section-title">Extras</div><div class="grid" id="extrasGrid"></div></section>

<div id="badge" style="display:none;">0</div>

<div id="cart">
<h2>🛒 Pedido</h2>
<div id="items"></div>
<h2 id="total">$0</h2>
<button onclick="sendWhatsApp()">Confirmar Pedido</button>
</div>

<footer>Kizuna Sushi © 2026</footer>

<script>
const API="https://kizuna-api-8ja8.onrender.com";
let products=[],cart=[];

async function load(){
const res=await fetch(`${API}/products`);
products=await res.json();
render("rolls","rollsGrid");
render("combos","combosGrid");
render("veggie","veggieGrid");
render("bandejas","bandejasGrid");
render("extras","extrasGrid");
}

function stockClass(s){
if(s<=5)return"stock-critical";
if(s<=10)return"stock-low";
return"stock-ok";
}

function stockText(s){
if(s<=5)return"⚠ Últimas unidades";
if(s<=10)return"Stock bajo";
return"Disponible";
}

function render(cat,id){
const div=document.getElementById(id);
div.innerHTML="";
products.filter(p=>p.category===cat).forEach(p=>{
div.innerHTML+=`
<div class="card">
<img src="${p.image}">
<div class="content">
<h3>${p.name}</h3>
<p class="desc">${p.description||"Selección premium artesanal."}</p>
<div class="price">$${p.price}</div>
<div class="${stockClass(p.stock)}">${stockText(p.stock)}</div>
<button onclick='addToCart(${JSON.stringify(p)})'>Agregar</button>
</div>
</div>`;
});
}

function addToCart(p){
const f=cart.find(i=>i._id===p._id);
if(f)f.qty++;
else cart.push({...p,qty:1});
updateCart();
}

function changeQty(id,v){
const i=cart.find(x=>x._id===id);
i.qty+=v;
if(i.qty<=0)cart=cart.filter(x=>x._id!==id);
updateCart();
}

function updateCart(){
items.innerHTML="";
let total=0,count=0;
cart.forEach(i=>{
items.innerHTML+=`
<div class="cart-item">
<div>${i.name}</div>
<div class="qty">
<button onclick="changeQty('${i._id}',-1)">−</button>
<span>${i.qty}</span>
<button onclick="changeQty('${i._id}',1)">+</button>
</div>
</div>`;
total+=i.price*i.qty;
count+=i.qty;
});
document.getElementById("total").innerHTML=`$${total}`;
const badge=document.getElementById("badge");

badge.innerHTML=count;

if(count===0){
badge.style.display="none";
}else{
badge.style.display="flex";
}
}

function sendWhatsApp(){
let msg="🍣 Pedido Kizuna%0A%0A";
cart.forEach(i=>msg+=`• ${i.name} x${i.qty}%0A`);
msg+=`%0ATotal: ${total.innerHTML}`;
window.open(`https://wa.me/1121734894?text=${msg}`,"_blank");
}

load();
</script>

</body>
</html>
