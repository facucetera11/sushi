<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizuna Sushi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --red: #d86a5e;
  --navy: #16204a;
  --cream: rgb(243, 241, 238);
  --green: #2e8b57;
  --shadow: 0 18px 45px rgba(0,0,0,.09);
}

* { margin:0; padding:0; box-sizing:border-box; scroll-behavior:smooth; }

body {
  background: var(--cream);
  color: var(--navy);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

/* HEADER */
header {
  position: fixed; top: 0; width: 100%;
  padding: 18px 7%;
  display: flex; justify-content: space-between; align-items: center;
  background: rgb(243, 241, 238);
  backdrop-filter: blur(20px);
  z-index: 999;
  border-bottom: 1px solid rgba(22,32,74,.07);
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 30px; font-weight: 900;
  color: var(--red);
  letter-spacing: -1px;
}

#statusBadge {
  font-size: 12px; font-weight: 700;
  padding: 5px 13px; border-radius: 20px;
  background: rgba(0,0,0,.07);
  margin-left: 12px;
  transition: .3s;
}

nav { display: flex; gap: 22px; }
nav a {
  text-decoration: none; font-weight: 700;
  color: var(--navy); font-size: 14px;
  opacity: .75;
  transition: opacity .2s;
}
nav a:hover { opacity: 1; }

/* HERO */
.hero {
  position: relative; height: 100vh;
  display: flex; justify-content: center; align-items: center;
  flex-direction: column; color: rgb(221, 205, 178); text-align: center;
  overflow: hidden;
}

.hero-slide {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: 0; transition: opacity 1.6s ease-in-out; z-index: 0;
}
.hero-slide.active { opacity: 1; }

.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,.3) 0%, rgba(0,0,0,.5) 100%);
  z-index: 1;
}

.hero-content { position: relative; z-index: 2; }

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 100px; font-weight: 900;
  letter-spacing: -3px;
  line-height: .95;
  text-shadow: 0 4px 30px rgba(0,0,0,.3);
}

.hero p {
  font-size: 20px; margin-top: 16px;
  opacity: .85; letter-spacing: 2px;
  text-transform: uppercase; font-weight: 500;
}

/* SECTIONS */
section { padding: 110px 7%; }

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 52px; font-weight: 900;
  color: var(--red);
  margin-bottom: 42px;
  letter-spacing: -1.5px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 30px;
}

.empty-cat {
  opacity: .45; font-size: 15px; padding: 20px 0;
}

/* CARDS */
.card {
  background: white;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform .25s, box-shadow .25s;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 28px 60px rgba(0,0,0,.13);
}

.card img {
  width: 100%; height: 220px;
  object-fit: cover;
  display: block;
}

.card-body { padding: 22px; }
.card-body h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.card-desc { opacity: .6; font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
.card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.price {
  font-size: 22px; font-weight: 900;
  color: var(--red); white-space: nowrap;
}

.stock-badge {
  font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 10px;
  background: rgba(216,106,94,.1);
  color: var(--red);
}

.btn-add {
  flex: 1;
  padding: 12px 0;
  border: none; border-radius: 14px;
  background: var(--navy); color: white;
  font-weight: 700; font-size: 14px;
  cursor: pointer;
  transition: .2s;
}
.btn-add:hover:not(:disabled) {
  background: var(--red);
  transform: translateY(-2px);
}
.btn-add:disabled {
  background: #ddd; color: #999; cursor: not-allowed;
  transform: none;
}

/* CART */
#cart {
  position: fixed; right: 20px; bottom: 20px;
  width: 370px;
  background: white;
  padding: 24px;
  border-radius: 28px;
  box-shadow: 0 24px 70px rgba(0,0,0,.18);
  max-height: 78vh;
  overflow-y: auto;
  z-index: 998;
  transition: transform .3s, opacity .3s;
}

#cart.hidden {
  transform: translateY(20px);
  opacity: 0;
  pointer-events: none;
}

.cart-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px;
}
.cart-header h2 { font-size: 20px; font-weight: 800; }

#cartCount {
  background: var(--red); color: white;
  font-size: 12px; font-weight: 800;
  padding: 3px 9px; border-radius: 20px;
}

.cart-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,.06);
}
.cart-item-name { font-size: 14px; font-weight: 600; flex: 1; }
.cart-item-sub { font-size: 12px; opacity: .5; }

.qty {
  display: flex; gap: 8px; align-items: center;
}
.qty button {
  width: 30px; height: 30px; padding: 0;
  border: none; border-radius: 8px;
  background: var(--cream); color: var(--navy);
  font-weight: 800; font-size: 16px;
  cursor: pointer; transition: .15s;
  display: flex; align-items: center; justify-content: center;
}
.qty button:hover { background: var(--red); color: white; }
.qty span { font-weight: 700; min-width: 22px; text-align: center; }

#cartTotal {
  font-size: 24px; font-weight: 900;
  margin: 18px 0 14px;
  color: var(--navy);
}

#btnConfirm {
  width: 100%; padding: 16px;
  border: none; border-radius: 18px;
  background: var(--red); color: white;
  font-weight: 800; font-size: 16px;
  cursor: pointer; transition: .2s;
}
#btnConfirm:hover { background: #c45a4f; transform: translateY(-2px); }
#btnConfirm:disabled { background: #ccc; cursor: not-allowed; transform: none; }

/* Cart FAB (mobile) */
#cartFab {
  display: none;
  position: fixed; right: 20px; bottom: 20px;
  width: 62px; height: 62px;
  background: var(--red); color: white;
  border-radius: 50%;
  border: none; cursor: pointer;
  font-size: 24px;
  box-shadow: 0 8px 24px rgba(216,106,94,.4);
  z-index: 999;
  align-items: center; justify-content: center;
  transition: transform .2s;
}
#cartFab:hover { transform: scale(1.08); }
#fabCount {
  position: absolute; top: -2px; right: -2px;
  background: var(--navy); color: white;
  font-size: 11px; font-weight: 800;
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}

/* TOAST */
#toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--navy); color: white;
  padding: 14px 26px; border-radius: 16px;
  font-weight: 700; font-size: 14px;
  opacity: 0; transition: .3s; z-index: 9999;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* LOADING */
.skeleton {
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 24px; height: 280px;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

footer {
  background: var(--navy); color: white;
  padding: 50px; text-align: center;
  font-size: 14px; opacity: 1;
}
footer p { opacity: .6; margin-top: 6px; }

/* RESPONSIVE */
@media(max-width:768px) {
  header { flex-wrap: wrap; gap: 10px; padding: 12px 5%; }
  nav { gap: 14px; }
  nav a { font-size: 13px; }
  .hero h1 { font-size: 48px; letter-spacing: -1px; }
  .hero p { font-size: 14px; }
  section { padding: 70px 5%; }
  .section-title { font-size: 34px; }
  .grid { grid-template-columns: 1fr; }

  #cart { display: none; }
  #cart.mobile-open {
    display: block;
    width: 92%; right: 4%; bottom: 90px;
    max-height: 60vh;
  }
  #cartFab { display: flex; }
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:4px;">
    <div class="logo">KIZUNA</div>
    <div id="statusBadge"></div>
  </div>
  <nav>
    <a href="#rolls">Rolls</a>
    <a href="#combos">Combos</a>
    <a href="#veggie">Veggie</a>
    <a href="#bandejas">Bandejas</a>
    <a href="#extras">Extras</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-slide active" style="background-image:url('https://images.unsplash.com/photo-1579871494447-9811cf80d66c')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1617196034183-421b4040ed20')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1611143669185-af224c5e3252')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1562802378-063ec186a863')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1559410545-0bdcd187e0a6')"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>KIZUNA<br>SUSHI</h1>
    <p>Alta cocina japonesa artesanal</p>
  </div>
</section>

<section id="rolls"><div class="section-title">Rolls</div><div class="grid" id="rollsGrid"></div></section>
<section id="combos"><div class="section-title">Combos</div><div class="grid" id="combosGrid"></div></section>
<section id="veggie"><div class="section-title">Veggie</div><div class="grid" id="veggieGrid"></div></section>
<section id="bandejas"><div class="section-title">Bandejas</div><div class="grid" id="bandejasGrid"></div></section>
<section id="extras"><div class="section-title">Extras</div><div class="grid" id="extrasGrid"></div></section>

<!-- CART desktop -->
<div id="cart">
  <div class="cart-header">
    <h2>Tu pedido</h2>
    <span id="cartCount">0</span>
  </div>
  <div id="items"></div>
  <div id="cartTotal">$0</div>
  <button id="btnConfirm" onclick="sendWhatsApp()" disabled>Confirmar por WhatsApp</button>
</div>

<!-- FAB mobile -->
<button id="cartFab" onclick="toggleCartMobile()">
  🛒
  <span id="fabCount">0</span>
</button>

<div id="toast"></div>

<footer>
  <div class="logo" style="font-size:28px;margin-bottom:10px;">KIZUNA</div>
  <p>Alta cocina japonesa artesanal · Buenos Aires</p>
  <p style="margin-top:8px;">© 2026 Kizuna Sushi</p>
</footer>

<script>
const API = "https://kizuna-api-8ja8.onrender.com";
let products = [], cart = [], settings = {};

/* ── SLIDESHOW ── */
const slides = document.querySelectorAll(".hero-slide");
let currentSlide = 0;
setInterval(() => {
  slides[currentSlide].classList.remove("active");
  currentSlide = (currentSlide + 1) % slides.length;
  slides[currentSlide].classList.add("active");
}, 4500);

/* ── TOAST ── */
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

/* ── LOAD ── */
async function load() {
  // Skeletons
  ["rollsGrid","combosGrid","veggieGrid","bandejasGrid","extrasGrid"].forEach(id => {
    document.getElementById(id).innerHTML =
      `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  });

  try {
    [products, settings] = await Promise.all([
      fetch(`${API}/products`).then(r => r.json()),
      fetch(`${API}/settings`).then(r => r.json())
    ]);

    updateStatus();
    ["rolls","combos","veggie","bandejas","extras"].forEach(cat => render(cat, cat + "Grid"));

  } catch (err) {
    ["rollsGrid","combosGrid","veggieGrid","bandejasGrid","extrasGrid"].forEach(id => {
      document.getElementById(id).innerHTML =
        `<p class="empty-cat">Error al cargar. Recargá la página.</p>`;
    });
  }
}

/* ── STATUS ── */
function updateStatus() {
  const now = new Date();
  const badge = document.getElementById("statusBadge");

  if (!settings.openDays || !settings.openDays.includes(now.getDay())) {
    badge.textContent = "⛔ Cerrado hoy";
    badge.style.cssText = "background:rgba(216,106,94,.12);color:#d86a5e;";
    return;
  }

  const h = now.getHours();
  if (h >= settings.openHour && h < settings.closeHour) {
    badge.textContent = "🟢 Abierto";
    badge.style.cssText = "background:rgba(46,139,87,.12);color:#2e8b57;";
  } else {
    badge.textContent = `🔴Cerrado-Abrimos ${settings.openHour}:00`;
    badge.style.cssText = "background:rgba(216,106,94,.12);color:#d86a5e;";
  }
}

/* ── RENDER PRODUCTS ── */
function render(cat, id) {
  const filtered = products.filter(p => p.category === cat);
  const container = document.getElementById(id);

  if (!filtered.length) {
    container.innerHTML = `<p class="empty-cat">Sin productos disponibles por ahora.</p>`;
    return;
  }

  container.innerHTML = filtered.map(p => {
    const sinStock = p.stock <= 0;
    return `
    <div class="card">
      <img src="${p.image || 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c'}"
           alt="${p.name}"
           onerror="this.src='https://images.unsplash.com/photo-1579871494447-9811cf80d66c'">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="card-desc">${p.description || ""}</p>
        <div class="card-bottom">
          <div>
            <div class="price">$${p.price}</div>
            ${sinStock ? `<span class="stock-badge">Sin stock</span>` : ""}
          </div>
          <button class="btn-add"
            onclick='addToCart(${JSON.stringify(p)})'
            ${sinStock ? "disabled" : ""}>
            ${sinStock ? "Agotado" : "Agregar"}
          </button>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* ── CART ── */
function addToCart(p) {
  if (p.stock <= 0) return;
  const found = cart.find(i => i._id === p._id);
  if (found) {
    if (found.qty >= p.stock) { toast("Stock máximo alcanzado"); return; }
    found.qty++;
  } else {
    cart.push({ ...p, qty: 1 });
  }
  updateCart();
  toast(`✓ ${p.name} agregado`);
}

function changeQty(id, delta) {
  const item = cart.find(x => x._id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(x => x._id !== id);
  updateCart();
}

function updateCart() {
  const itemsDiv = document.getElementById("items");
  let total = 0;
  let count = 0;

  if (!cart.length) {
    itemsDiv.innerHTML = `<p style="opacity:.4;font-size:14px;padding:10px 0;">Tu carrito está vacío</p>`;
  } else {
    itemsDiv.innerHTML = cart.map(i => {
      const sub = i.price * i.qty;
      total += sub;
      count += i.qty;
      return `
      <div class="cart-item">
        <div>
          <div class="cart-item-name">${i.name}</div>
          <div class="cart-item-sub">$${i.price} c/u</div>
        </div>
        <div class="qty">
          <button onclick="changeQty('${i._id}',-1)">−</button>
          <span>${i.qty}</span>
          <button onclick="changeQty('${i._id}',1)">+</button>
        </div>
      </div>`;
    }).join("");
  }

  document.getElementById("cartTotal").textContent = `Total: $${total}`;
  document.getElementById("cartCount").textContent = count;
  document.getElementById("fabCount").textContent = count;
  document.getElementById("btnConfirm").disabled = cart.length === 0;
}

function toggleCartMobile() {
  const c = document.getElementById("cart");
  c.classList.toggle("mobile-open");
}

/* ── WHATSAPP ── */
async function sendWhatsApp() {
  if (!cart.length) return;

  const btn = document.getElementById("btnConfirm");
  btn.disabled = true;
  btn.textContent = "Enviando...";

  let msg = "🍣 Pedido Kizuna%0A%0A";
  let total = 0;
  const snapshot = cart.map(i => ({ _id: i._id, name: i.name, qty: i.qty, price: i.price }));

  snapshot.forEach(i => {
    msg += `• ${i.name} x${i.qty} — $${i.price * i.qty}%0A`;
    total += i.price * i.qty;
  });
  msg += `%0ATotal: $${total}`;

  try {
    const res = await fetch(`${API}/orders`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: snapshot, total })
    });

    if (res.ok) {
      cart = [];
      updateCart();
      location.href = `https://wa.me/5491121734894?text=${msg}`;
    } else {
      const data = await res.json();
      toast(`❌ ${data.error || "Error al registrar el pedido"}`);
      btn.disabled = false;
      btn.textContent = "Confirmar por WhatsApp";
    }
  } catch (err) {
    toast("❌ Error de conexión. Intentá de nuevo.");
    btn.disabled = false;
    btn.textContent = "Confirmar por WhatsApp";
  }
}

load();
</script>

</body>
</html>
