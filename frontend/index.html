<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizuna</title>
<style>
body{
font-family:Arial;
background:#fcfaf6;
padding:50px;
}
.card{
background:white;
padding:20px;
margin:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.08);
}
img{
width:300px;
border-radius:20px;
}
</style>
</head>
<body>

<h1>Kizuna Sushi</h1>

<div id="products"></div>

<script>

const API="https://kizuna-api-8ja8.onrender.com";

async function load(){

const res=await fetch(`${API}/products`);
const products=await res.json();

document.getElementById("products").innerHTML=
products.map(p=>`
<div class="card">
<img src="${p.image}">
<h2>${p.name}</h2>
<p>$${p.price}</p>
<p>${p.category}</p>
</div>
`).join("");

}

load();

</script>

</body>
</html>
