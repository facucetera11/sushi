<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizuna Sushi</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
scroll-behavior:smooth;
}

body{
background:linear-gradient(180deg,#faf8f5,#f5f1eb);
color:#16204a;
overflow-x:hidden;
}

header{
position:fixed;
top:0;
width:100%;
padding:22px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.75);
backdrop-filter:blur(20px);
z-index:1000;
}

.logo{
font-size:34px;
font-weight:900;
color:#d86a5e;
}

nav{
display:flex;
gap:28px;
}

nav a{
text-decoration:none;
font-weight:700;
color:#16204a;
}

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
url('https://images.unsplash.com/photo-1579871494447-9811cf80d66c');
background-size:cover;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
}

.hero h1{
font-size:90px;
}

section{
padding:120px 8%;
}

.section-title{
font-size:54px;
color:#d86a5e;
margin-bottom:45px;
font-weight:900;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:35px;
}

.card{
background:white;
border-radius:30px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.content{
padding:25px;
}

.price{
font-size:24px;
font-weight:900;
color:#d86a5e;
margin:10px 0;
}

.stock{
font-weight:700;
margin-bottom:15px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:#16204a;
color:white;
font-weight:800;
cursor:pointer;
}

button:hover{
background:#d86a5e;
}

#cart{
position:fixed;
right:25px;
bottom:25px;
width:380px;
background:white;
padding:25px;
border-radius:28px;
box-shadow:0 15px 45px rgba(0,0,0,.12);
z-index:9999;
max-height:80vh;
overflow:auto;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
}

.qty{
display:flex;
gap:8px;
}

.qty button{
width:35px;
padding:8px;
}

footer{
background:#16204a;
color:white;
padding:60px;
text-align:center;
margin-top:100px;
}
</style>
</head>
<body>

<header>
<div class="logo">KIZUNA</div>
<nav>
<a href="#rolls">Rolls</a>
<a href="#combos">Combos</a>
<a href="#veggie">Veggie</a>
<a href="#bandejas">Bandejas</a>
<a href="#extras">Extras</a>
</nav>
</header>

<section class="hero">
<h1>KIZUNA SUSHI</h1>
<p>Experiencia premium</p>
</section>

<section id="rolls"><div class="section-title">Rolls</div><div class="grid" id="rollsGrid"></div></section>
<section id="combos"><div class="section-title">Combos</div><div class="grid" id="combosGrid"></div></section>
<section id="veggie"><div class="section-title">Veggie</div><div class="grid" id="veggieGrid"></div></section>
<section id="bandejas"><div class="section-title">Bandejas</div><div class="grid" id="bandejasGrid"></div></section>
<section id="extras"><div class="section-title">Extras</div><div class="grid" id="extrasGrid"></div></section>

<div id="cart">
<h2>🛒 Pedido</h2>
<div id="cartItems"></div>
<h3 id="cartTotal">Total: $0</h3>
<button onclick="sendWhatsApp()">Confirmar Pedido</button>
</div>

<footer>Kizuna Sushi © 2026</footer>

<script>

const API="http://localhost:5000";
let cart=[];
let products=[];

async function loadProducts(){

const res=await fetch(`${API}/products`);
products=await res.json();

renderAll();
updateCart();

}

function renderAll(){
render("rolls","rollsGrid");
render("combos","combosGrid");
render("veggie","veggieGrid");
render("bandejas","bandejasGrid");
render("extras","extrasGrid");
}

function render(category,id){

const container=document.getElementById(id);
container.innerHTML="";

products
.filter(p=>p.category===category)
.forEach(product=>{

container.innerHTML+=`
<div class="card">
<img src="${product.image}">
<div class="content">
<h3>${product.name}</h3>
<div class="price">$${product.price}</div>
<div class="stock">Stock: ${product.stock}</div>

<button
${product.stock<=0?"disabled":""}
onclick='addToCart("${product._id}")'>
${product.stock<=0?"Sin Stock":"Agregar"}
</button>

</div>
</div>`;
});
}

function addToCart(id){

const product=products.find(p=>p._id===id);

const item=cart.find(i=>i._id===id);

if(item){
if(item.qty<product.stock)item.qty++;
}else{
cart.push({...product,qty:1});
}

updateCart();
}

function changeQty(id,val){

const item=cart.find(i=>i._id===id);

if(!item)return;

item.qty+=val;

if(item.qty<=0){
cart=cart.filter(i=>i._id!==id);
}

updateCart();
}

function updateCart(){

let html="";
let total=0;

cart.forEach(item=>{

html+=`
<div class="cart-item">
<div>${item.name} x${item.qty}</div>

<div class="qty">
<button onclick="changeQty('${item._id}',-1)">−</button>
<button onclick="changeQty('${item._id}',1)">+</button>
</div>

<div>$${item.price*item.qty}</div>
</div>
`;

total+=item.price*item.qty;

});

cartItems.innerHTML=html;
cartTotal.innerHTML=`Total: $${total}`;
}

async function sendWhatsApp(){

if(!cart.length){
alert("Carrito vacío");
return;
}

for(const item of cart){

for(let i=0;i<item.qty;i++){

await fetch(`${API}/buy/${item._id}`,{
method:"POST"
});

}

}

let msg="Hola Kizuna, quiero pedir:%0A%0A";

cart.forEach(i=>{
msg+=`• ${i.name} x${i.qty} - $${i.price*i.qty}%0A`;
});

const total=cart.reduce((a,b)=>a+b.price*b.qty,0);

msg+=`%0ATotal: $${total}`;

window.open(
`https://wa.me/1121734894?text=${msg}`,
"_blank"
);

cart=[];

await loadProducts();

}

loadProducts();

</script>

</body>
</html>
