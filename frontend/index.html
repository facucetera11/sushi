<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizuna Sushi</title>

<style>
body{
font-family:Arial;
background:#faf8f5;
margin:0;
}

header{
background:#16204a;
color:white;
padding:30px;
text-align:center;
font-size:40px;
font-weight:900;
}

section{
padding:40px;
}

h2{
color:#d86a5e;
font-size:35px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

img{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#d86a5e;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

#cart{
position:fixed;
right:20px;
bottom:20px;
width:300px;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}
</style>
</head>
<body>

<header>KIZUNA SUSHI</header>

<section>
<h2>Rolls</h2>
<div class="grid" id="rollsGrid"></div>
</section>

<section>
<h2>Combos</h2>
<div class="grid" id="combosGrid"></div>
</section>

<section>
<h2>Veggie</h2>
<div class="grid" id="veggieGrid"></div>
</section>

<section>
<h2>Bandejas</h2>
<div class="grid" id="bandejasGrid"></div>
</section>

<section>
<h2>Extras</h2>
<div class="grid" id="extrasGrid"></div>
</section>

<div id="cart">
<h2>Pedido</h2>
<div id="items"></div>
<h3 id="total">$0</h3>
<button onclick="sendWhatsApp()">Confirmar</button>
</div>

<script>

const API="https://kizuna-api-8ja8.onrender.com";

let cart=[];
let products=[];

async function load(){

const res=await fetch(`${API}/products`);
products=await res.json();

render("rolls","rollsGrid");
render("combos","combosGrid");
render("veggie","veggieGrid");
render("bandejas","bandejasGrid");
render("extras","extrasGrid");

}

function render(category,id){

const div=document.getElementById(id);
div.innerHTML="";

products
.filter(p=>p.category?.toLowerCase().trim()===category)
.forEach(p=>{

div.innerHTML+=`
<div class="card">
<img src="${p.image}">
<h3>${p.name}</h3>
<p>$${p.price}</p>
<p>Stock: ${p.stock}</p>
<button onclick='addToCart(${JSON.stringify(p)})'>
Agregar
</button>
</div>
`;

});

}

function addToCart(p){
cart.push(p);
updateCart();
}

function updateCart(){

items.innerHTML="";
let total=0;

cart.forEach(i=>{
items.innerHTML+=`<p>${i.name} - $${i.price}</p>`;
total+=i.price;
});

document.getElementById("total").innerHTML=`$${total}`;

}

async function sendWhatsApp(){

for(const item of cart){
await fetch(`${API}/buy/${item._id}`,{
method:"POST"
});
}

window.open("https://wa.me/1121734894","_blank");

cart=[];
load();
updateCart();

}

load();

</script>

</body>
</html>
