<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizuna Sushi</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;scroll-behavior:smooth;}
body{background:#fcfaf6;color:#16204a;overflow-x:hidden;}

header{
position:fixed;top:0;width:100%;padding:22px 8%;
display:flex;justify-content:space-between;align-items:center;
background:rgba(255,255,255,.92);backdrop-filter:blur(18px);z-index:999;
}

.logo{font-size:34px;font-weight:900;color:#d86a5e;}

nav{display:flex;gap:20px;}
nav a{text-decoration:none;font-weight:800;color:#16204a;}

.hero{
position:relative;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
text-align:center;
overflow:hidden;
}

.hero-slide{
position:absolute;
inset:0;
background-size:cover;
background-position:center;
opacity:0;
transition:opacity 1.5s ease-in-out;
z-index:0;
}

.hero-slide.active{
opacity:1;
}

.hero-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.38);
z-index:1;
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{font-size:95px;}
.hero p{font-size:24px;margin-top:15px;}

#statusBox{
margin-top:20px;
padding:14px 28px;
background:rgba(255,255,255,.15);
border-radius:20px;
font-weight:800;
backdrop-filter:blur(10px);
}

section{padding:120px 8%;}

.section-title{
font-size:56px;
font-weight:900;
color:#d86a5e;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:35px;
}

.card{
background:white;
border-radius:28px;
overflow:hidden;
box-shadow:0 18px 45px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:240px;
object-fit:cover;
}

.content{padding:24px;}

.desc{opacity:.7;margin:10px 0;}

.price{
font-size:24px;
font-weight:900;
color:#d86a5e;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:18px;
background:#16204a;
color:white;
font-weight:800;
cursor:pointer;
}

#cart{
position:fixed;
right:20px;
bottom:20px;
width:360px;
background:white;
padding:24px;
border-radius:28px;
box-shadow:0 20px 60px rgba(0,0,0,.15);
max-height:75vh;
overflow:auto;
}

.cart-item{
display:flex;
justify-content:space-between;
margin:12px 0;
}

.qty{
display:flex;
gap:8px;
align-items:center;
}

.qty button{
width:34px;
padding:8px;
}

#total{
font-size:22px;
font-weight:900;
margin:15px 0;
}

footer{
background:#16204a;
color:white;
padding:50px;
text-align:center;
margin-top:80px;
}

@media(max-width:768px){

header{
flex-direction:column;
padding:14px 5%;
}

.hero h1{font-size:42px;}
.hero p{font-size:17px;}

section{padding:70px 5%;}

.section-title{font-size:32px;}

.grid{grid-template-columns:1fr;}

#cart{
width:92%;
right:4%;
bottom:10px;
max-height:38vh;
}

}
</style>
</head>
<body>

<header>
<div class="logo">KIZUNA</div>
<nav>
<a href="#rolls">Rolls</a>
<a href="#combos">Combos</a>
<a href="#veggie">Veggie</a>
<a href="#bandejas">Bandejas</a>
<a href="#extras">Extras</a>
</nav>
</header>

<section class="hero">
  <div class="hero-slide active" style="background-image:url('https://images.unsplash.com/photo-1579871494447-9811cf80d66c')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1617196034183-421b4040ed20')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1611143669185-af224c5e3252')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1562802378-063ec186a863')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1559410545-0bdcd187e0a6')"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>KIZUNA SUSHI</h1>
    <p>Alta cocina japonesa artesanal</p>
    <div id="statusBox"></div>
  </div>
</section>

<section id="rolls"><div class="section-title">Rolls</div><div class="grid" id="rollsGrid"></div></section>
<section id="combos"><div class="section-title">Combos</div><div class="grid" id="combosGrid"></div></section>
<section id="veggie"><div class="section-title">Veggie</div><div class="grid" id="veggieGrid"></div></section>
<section id="bandejas"><div class="section-title">Bandejas</div><div class="grid" id="bandejasGrid"></div></section>
<section id="extras"><div class="section-title">Extras</div><div class="grid" id="extrasGrid"></div></section>

<div id="cart">
<h2>🛒 Pedido</h2>
<div id="items"></div>
<div id="total">$0</div>
<button onclick="sendWhatsApp()">Confirmar Pedido</button>
</div>

<footer>Kizuna Sushi © 2026</footer>

<script>

const API="https://kizuna-api-8ja8.onrender.com";

let products=[],cart=[],settings={};

// Slideshow del hero
const slides = document.querySelectorAll(".hero-slide");
let current = 0;

setInterval(() => {
  slides[current].classList.remove("active");
  current = (current + 1) % slides.length;
  slides[current].classList.add("active");
}, 4000);

async function load() {
  // Mostrar loading en cada sección
  ["rollsGrid", "combosGrid", "veggieGrid", "bandejasGrid", "extrasGrid"].forEach(id => {
    document.getElementById(id).innerHTML = `
      <p style="opacity:.5;font-size:14px;">Cargando...</p>
    `;
  });

  statusBox.innerHTML = "⏳ Verificando horario...";

  try {
    const p = await fetch(`${API}/products`);
    products = await p.json();

    const s = await fetch(`${API}/settings`);
    settings = await s.json();

    updateStatus();

    ["rolls", "combos", "veggie", "bandejas", "extras"]
      .forEach(cat => render(cat, cat + "Grid"));

  } catch (err) {
    statusBox.innerHTML = "⚠️ No se pudo conectar con el servidor";
    ["rollsGrid", "combosGrid", "veggieGrid", "bandejasGrid", "extrasGrid"].forEach(id => {
      document.getElementById(id).innerHTML = `
        <p style="opacity:.5;font-size:14px;">Error al cargar productos. Intentá recargar la página.</p>
      `;
    });
  }
  
}

function updateStatus(){

const now=new Date();
const day=now.getDay();
const hour=now.getHours();

if(!settings.openDays.includes(day)){
statusBox.innerHTML="⛔ Hoy cerrado";
return;
}

if(hour>=settings.openHour && hour<settings.closeHour){
statusBox.innerHTML="🟢 Abierto ahora";
}else{
statusBox.innerHTML=`🔴 Cerrado · Abrimos ${settings.openHour}:00`;
}
}

function render(cat,id){
document.getElementById(id).innerHTML="";

products.filter(p=>p.category===cat)
.forEach(p=>{

document.getElementById(id).innerHTML+=`
<div class="card">
<img src="${p.image}">
<div class="content">
<h3>${p.name}</h3>
<p class="desc">${p.description||""}</p>
<div class="price">$${p.price}</div>
<button onclick='addToCart(${JSON.stringify(p)})'>Agregar</button>
</div>
</div>
`;

});
}

function addToCart(p){
const f=cart.find(i=>i._id===p._id);
if(f)f.qty++;
else cart.push({...p,qty:1});
updateCart();
}

function changeQty(id,v){
const i=cart.find(x=>x._id===id);
i.qty+=v;
if(i.qty<=0)cart=cart.filter(x=>x._id!==id);
updateCart();
}

function updateCart(){

items.innerHTML="";
let total=0;

cart.forEach(i=>{
items.innerHTML+=`
<div class="cart-item">
<div>${i.name}</div>
<div class="qty">
<button onclick="changeQty('${i._id}',-1)">−</button>
<span>${i.qty}</span>
<button onclick="changeQty('${i._id}',1)">+</button>
</div>
</div>`;
total+=i.price*i.qty;
});

document.getElementById("total").innerHTML=`$${total}`;
}

async function sendWhatsApp() {
  if (cart.length === 0) {
    alert("Tu carrito está vacío");
    return;
  }

  let msg = "🍣 Pedido Kizuna%0A%0A";
  let total = 0;
  const itemsParaEnviar = [...cart]; // Guardamos copia antes de vaciar

  cart.forEach(i => {
    msg += `• ${i.name} x${i.qty}%0A`;
    total += i.price * i.qty;
  });

  msg += `%0ATotal: $${total}`;

  // Registrar pedido en la API
  try {
    await fetch(`${API}/orders`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        items: itemsParaEnviar.map(i => ({ _id: i._id, name: i.name, qty: i.qty, price: i.price })),
        total: total
      })
    });
  } catch (err) {
    console.error("No se pudo registrar el pedido:", err);
  }

  // Vaciar carrito
  cart = [];
  updateCart();

  // Redirigir a WhatsApp (funciona en mobile y desktop)
  location.href = `https://wa.me/1121734894?text=${msg}`;
}

load();

</script>

</body>
</html>
