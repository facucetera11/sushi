<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kizuna Premium</title>

<style>
*{
margin:0;padding:0;box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
scroll-behavior:smooth;
}

body{
background:#fcfaf6;
color:#16204a;
overflow-x:hidden;
}

header{
position:fixed;
width:100%;
padding:24px 8%;
display:flex;
justify-content:space-between;
background:rgba(255,255,255,.82);
backdrop-filter:blur(18px);
z-index:999;
}

.logo{
font-size:34px;
font-weight:900;
color:#d86a5e;
}

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
url("https://images.unsplash.com/photo-1617196035154-1e1b79cd4e64");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
animation:cinema 22s infinite alternate ease-in-out;
}

@keyframes cinema{
0%{background-size:100%}
100%{background-size:120%}
}

.hero h1{
font-size:110px;
font-weight:900;
}

.hero p{
font-size:26px;
opacity:.9;
}

section{
padding:120px 8%;
}

.section-title{
font-size:56px;
font-weight:900;
color:#d86a5e;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
}

.card{
background:white;
border-radius:30px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,.08);
transition:.35s;
cursor:pointer;
}

.card:hover{
transform:translateY(-12px);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
transition:.45s;
}

.card:hover img{
transform:scale(1.08);
}

.content{
padding:25px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:#16204a;
color:white;
font-weight:800;
cursor:pointer;
}

#modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:none;
justify-content:center;
align-items:center;
z-index:99999;
}

.modal-box{
width:900px;
background:white;
border-radius:35px;
overflow:hidden;
display:flex;
animation:pop .3s ease;
}

@keyframes pop{
from{transform:scale(.9);opacity:0}
to{transform:scale(1);opacity:1}
}

.modal-box img{
width:50%;
height:650px;
object-fit:cover;
}

.modal-content{
padding:50px;
width:50%;
display:flex;
flex-direction:column;
justify-content:center;
}

.close{
margin-top:20px;
background:#d86a5e;
}

#cart{
position:fixed;
right:20px;
bottom:20px;
width:340px;
background:white;
padding:25px;
border-radius:28px;
box-shadow:0 20px 50px rgba(0,0,0,.14);
}
</style>
</head>
<body>

<header>
<div class="logo">KIZUNA</div>
</header>

<section class="hero">
<h1>KIZUNA</h1>
<p>Arte japonés servido en cada pieza</p>
</section>

<section>
<div class="section-title">Menú</div>
<div class="grid" id="products"></div>
</section>

<div id="cart">
<h2>🛒 Pedido</h2>
<div id="items"></div>
<h2 id="total">$0</h2>
<button onclick="sendWhatsApp()">Confirmar</button>
</div>

<div id="modal">
<div class="modal-box" id="modalBox"></div>
</div>

<script>

const API="https://kizuna-api-8ja8.onrender.com";
let products=[],cart=[];

async function load(){

const res=await fetch(`${API}/products`);
products=await res.json();

productsDiv.innerHTML="";

products.forEach(p=>{

productsDiv.innerHTML+=`
<div class="card" onclick='openModal(${JSON.stringify(p)})'>
<img src="${p.image}">
<div class="content">
<h2>${p.name}</h2>
<h3>$${p.price}</h3>
<button onclick='event.stopPropagation();addToCart(${JSON.stringify(p)})'>
Agregar
</button>
</div>
</div>
`;

});

}

const productsDiv=document.getElementById("products");

function openModal(p){

modal.style.display="flex";

modalBox.innerHTML=`
<img src="${p.image}">
<div class="modal-content">
<h1>${p.name}</h1>
<h2>$${p.price}</h2>
<p>Selección premium artesanal de Kizuna Sushi.</p>
<button onclick='addToCart(${JSON.stringify(p)})'>
Agregar al carrito
</button>
<button class="close" onclick="closeModal()">
Cerrar
</button>
</div>
`;

}

function closeModal(){
modal.style.display="none";
}

function addToCart(p){
cart.push(p);
updateCart();
closeModal();
}

function updateCart(){

items.innerHTML="";
let total=0;

cart.forEach(i=>{
items.innerHTML+=`<p>${i.name} - $${i.price}</p>`;
total+=i.price;
});

totalEl.innerHTML=`$${total}`;
}

async function sendWhatsApp(){

window.open("https://wa.me/1121734894","_blank");

}

const totalEl=document.getElementById("total");

load();

</script>

</body>
</html>
