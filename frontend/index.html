<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizuna Sushi</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
scroll-behavior:smooth;
}

body{
background:#fcfaf6;
color:#16204a;
overflow-x:hidden;
}

/* HEADER */

header{
position:fixed;
top:0;
width:100%;
padding:24px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.88);
backdrop-filter:blur(18px);
z-index:9999;
box-shadow:0 10px 25px rgba(0,0,0,.04);
}

.logo{
font-size:34px;
font-weight:900;
letter-spacing:4px;
color:#d86a5e;
}

nav{
display:flex;
gap:28px;
}

nav a{
text-decoration:none;
font-weight:800;
color:#16204a;
transition:.3s;
}

nav a:hover{
color:#d86a5e;
transform:translateY(-2px);
}

/* HERO */

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
url("https://images.unsplash.com/photo-1579871494447-9811cf80d66c");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
text-align:center;
animation:zoomHero 18s infinite alternate ease-in-out;
}

@keyframes zoomHero{
from{background-size:100%;}
to{background-size:115%;}
}

.hero h1{
font-size:100px;
font-weight:900;
animation:fadeUp 1s ease;
}

.hero p{
font-size:24px;
margin-top:15px;
animation:fadeUp 1.4s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* SECCIONES */

section{
padding:120px 8%;
}

.section-title{
font-size:58px;
font-weight:900;
color:#d86a5e;
margin-bottom:45px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:35px;
}

/* CARD */

.card{
background:white;
border-radius:30px;
overflow:hidden;
box-shadow:0 18px 45px rgba(0,0,0,.08);
transition:.35s;
}

.card:hover{
transform:translateY(-12px);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
transition:.45s;
}

.card:hover img{
transform:scale(1.08);
}

.content{
padding:25px;
}

.content h3{
font-size:28px;
}

.price{
font-size:24px;
font-weight:900;
color:#d86a5e;
margin:12px 0;
}

/* STOCK */

.stock-ok{
color:#34c759;
font-weight:800;
}

.stock-low{
color:#ff9500;
font-weight:800;
}

.stock-critical{
color:#ff3b30;
font-weight:800;
}

/* BOTONES */

button{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:#16204a;
color:white;
font-weight:800;
cursor:pointer;
transition:.25s;
}

button:hover{
background:#d86a5e;
transform:translateY(-3px);
}

button:active{
transform:scale(.96);
}

/* CARRITO */

#cart{
position:fixed;
right:20px;
bottom:20px;
width:380px;
background:white;
padding:28px;
border-radius:30px;
box-shadow:0 20px 60px rgba(0,0,0,.14);
z-index:9999;
max-height:80vh;
overflow:auto;
}

#badge{
position:fixed;
right:390px;
bottom:360px;
background:#d86a5e;
color:white;
width:50px;
height:50px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-weight:900;
font-size:20px;
box-shadow:0 10px 25px rgba(0,0,0,.18);
z-index:99999;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
margin:14px 0;
}

.qty{
display:flex;
gap:8px;
align-items:center;
}

.qty button{
width:36px;
padding:8px;
border-radius:12px;
}

#total{
font-size:24px;
font-weight:900;
margin:18px 0;
}

/* FOOTER */

footer{
background:#16204a;
color:white;
padding:60px;
text-align:center;
margin-top:100px;
}

</style>
</head>
<body>

<header>
<div class="logo">KIZUNA</div>

<nav>
<a href="#rolls">Rolls</a>
<a href="#combos">Combos</a>
<a href="#veggie">Veggie</a>
<a href="#bandejas">Bandejas</a>
<a href="#extras">Extras</a>
</nav>
</header>

<section class="hero">
<h1>KIZUNA SUSHI</h1>
<p>Alta cocina japonesa artesanal</p>
</section>

<section id="rolls"><div class="section-title">Rolls</div><div class="grid" id="rollsGrid"></div></section>
<section id="combos"><div class="section-title">Combos</div><div class="grid" id="combosGrid"></div></section>
<section id="veggie"><div class="section-title">Veggie</div><div class="grid" id="veggieGrid"></div></section>
<section id="bandejas"><div class="section-title">Bandejas</div><div class="grid" id="bandejasGrid"></div></section>
<section id="extras"><div class="section-title">Extras</div><div class="grid" id="extrasGrid"></div></section>

<div id="badge">0</div>

<div id="cart">
<h2>🛒 Pedido</h2>
<div id="items"></div>
<div id="total">$0</div>
<button onclick="sendWhatsApp()">Confirmar Pedido</button>
</div>

<footer>Kizuna Sushi © 2026</footer>

<script>

const API="https://kizuna-api-8ja8.onrender.com";

let products=[];
let cart=[];

async function load(){

const res=await fetch(`${API}/products`);
products=await res.json();

render("rolls","rollsGrid");
render("combos","combosGrid");
render("veggie","veggieGrid");
render("bandejas","bandejasGrid");
render("extras","extrasGrid");

}

function stockClass(stock){
if(stock<=5)return "stock-critical";
if(stock<=10)return "stock-low";
return "stock-ok";
}

function stockText(stock){
if(stock<=5)return "⚠ Últimas unidades";
if(stock<=10)return "Stock bajo";
return "Disponible";
}

function render(category,id){

const div=document.getElementById(id);
div.innerHTML="";

products
.filter(p=>p.category?.toLowerCase().trim()===category)
.forEach(p=>{

div.innerHTML+=`
<div class="card">
<img src="${p.image}">
<div class="content">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<div class="${stockClass(p.stock)}">
${stockText(p.stock)}
</div>
<button onclick='addToCart(${JSON.stringify(p)})'>
Agregar
</button>
</div>
</div>
`;

});

}

function addToCart(p){

const found=cart.find(i=>i._id===p._id);

if(found){
found.qty++;
}else{
cart.push({...p,qty:1});
}

updateCart();

}

function changeQty(id,val){

const item=cart.find(i=>i._id===id);

item.qty+=val;

if(item.qty<=0){
cart=cart.filter(i=>i._id!==id);
}

updateCart();

}

function updateCart(){

items.innerHTML="";
let total=0;
let count=0;

cart.forEach(i=>{

items.innerHTML+=`
<div class="cart-item">
<div>${i.name}<br>$${i.price}</div>

<div class="qty">
<button onclick="changeQty('${i._id}',-1)">−</button>
<span>${i.qty}</span>
<button onclick="changeQty('${i._id}',1)">+</button>
</div>
</div>
`;

total+=i.price*i.qty;
count+=i.qty;

});

document.getElementById("total").innerHTML=`$${total}`;
document.getElementById("badge").innerHTML=count;

}

async function sendWhatsApp(){

let msg="🍣 Pedido Kizuna%0A%0A";

cart.forEach(i=>{
msg+=`• ${i.name} x${i.qty}%0A`;
});

msg+=`%0ATotal: ${document.getElementById("total").innerHTML}`;

window.open(
`https://wa.me/1121734894?text=${msg}`,
"_blank"
);

}

load();

</script>

</body>
</html>
