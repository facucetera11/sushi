<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizuna Sushi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --red: #C0392B;
  --navy: #1a1a1a;
  --cream: #ffffff;
  --bg: #FAFAFA;
  --green: #2e8b57;
  --shadow: 0 8px 32px rgba(0,0,0,.07);
  --border: rgba(0,0,0,.07);
}

* { margin:0; padding:0; box-sizing:border-box; scroll-behavior:smooth; }

body {
  background: var(--bg);
  color: var(--navy);
  font-family: 'Jost', sans-serif;
  overflow-x: hidden;
}

/* HEADER */
header {
  position: fixed; top: 0; width: 100%;
  padding: 20px 7%;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 999;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px; font-weight: 700;
  color: var(--navy);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.logo span { color: var(--red); }

#statusBadge {
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.5px;
  padding: 5px 13px; border-radius: 20px;
  background: rgba(0,0,0,.05);
  margin-left: 14px;
  font-family: 'Jost', sans-serif;
  transition: .3s;
}

nav { display: flex; gap: 28px; align-items: center; }
nav a {
  text-decoration: none; font-weight: 400;
  color: var(--navy); font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: .55;
  transition: opacity .2s;
}
nav a:hover { opacity: 1; }

/* HERO */
.hero {
  position: relative; height: 100vh;
  display: flex; justify-content: center; align-items: center;
  flex-direction: column; color: white; text-align: center;
  overflow: hidden;
}

.hero-slide {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: 0; transition: opacity 1.6s ease-in-out; z-index: 0;
}
.hero-slide.active { opacity: 1; }

.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,.25) 0%, rgba(0,0,0,.55) 100%);
  z-index: 1;
}

.hero-content { position: relative; z-index: 2; }

.hero-eyebrow {
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  opacity: .65;
  font-weight: 400;
  margin-bottom: 18px;
}

.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 110px; font-weight: 700;
  letter-spacing: 6px;
  line-height: .9;
  text-transform: uppercase;
}

.hero-divider {
  width: 40px; height: 1px;
  background: rgba(255,255,255,.4);
  margin: 22px auto;
}

.hero p {
  font-size: 13px; 
  opacity: .7; letter-spacing: 4px;
  text-transform: uppercase; font-weight: 300;
}

/* SECTIONS */
section { padding: 100px 7%; background: var(--bg); }
section:nth-child(even) { background: #ffffff; }

.section-header {
  display: flex; align-items: baseline; gap: 16px;
  margin-bottom: 48px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 48px; font-weight: 700;
  color: var(--navy);
  letter-spacing: 1px;
}

.section-count {
  font-size: 12px; letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(0,0,0,.35);
  font-weight: 400;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
}

.empty-cat {
  opacity: .4; font-size: 14px; padding: 20px 0;
  letter-spacing: 1px;
}

/* CARDS */
.card {
  background: white;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: transform .25s, box-shadow .25s;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 50px rgba(0,0,0,.10);
}

.card img {
  width: 100%; height: 210px;
  object-fit: cover;
  display: block;
}

.card-body { padding: 22px 24px; }
.card-body h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px; font-weight: 600;
  margin-bottom: 6px;
  letter-spacing: 0.3px;
}
.card-desc { opacity: .5; font-size: 13px; line-height: 1.6; margin-bottom: 18px; font-weight: 300; }
.card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.price {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px; font-weight: 700;
  color: var(--navy); white-space: nowrap;
}

.stock-badge {
  font-size: 10px; font-weight: 500;
  letter-spacing: 1px;
  padding: 3px 9px; border-radius: 4px;
  background: rgba(192,57,43,.08);
  color: var(--red);
  text-transform: uppercase;
}

.btn-add {
  flex: 1;
  padding: 11px 0;
  border: 1px solid var(--navy); border-radius: 4px;
  background: transparent; color: var(--navy);
  font-weight: 500; font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  font-family: 'Jost', sans-serif;
  transition: .2s;
}
.btn-add:hover:not(:disabled) {
  background: var(--navy);
  color: white;
}
.btn-add:disabled {
  border-color: #ddd; color: #bbb; cursor: not-allowed;
}

/* CART */
#cart {
  position: fixed; right: 24px; bottom: 24px;
  width: 360px;
  background: white;
  padding: 28px;
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: 0 24px 60px rgba(0,0,0,.12);
  max-height: 78vh;
  overflow-y: auto;
  z-index: 998;
  transition: transform .3s, opacity .3s;
}

#cart.hidden {
  transform: translateY(20px);
  opacity: 0;
  pointer-events: none;
}

.cart-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.cart-header h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 700;
  letter-spacing: 0.5px;
}

#cartCount {
  background: var(--red); color: white;
  font-size: 11px; font-weight: 500;
  padding: 3px 10px; border-radius: 4px;
  letter-spacing: 0.5px;
}

.cart-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 0;
  border-bottom: 1px solid rgba(0,0,0,.05);
}
.cart-item-name { font-size: 14px; font-weight: 500; flex: 1; }
.cart-item-sub { font-size: 12px; opacity: .4; font-weight: 300; }

.qty {
  display: flex; gap: 8px; align-items: center;
}
.qty button {
  width: 28px; height: 28px; padding: 0;
  border: 1px solid var(--border); border-radius: 4px;
  background: white; color: var(--navy);
  font-weight: 500; font-size: 15px;
  cursor: pointer; transition: .15s;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Jost', sans-serif;
}
.qty button:hover { border-color: var(--red); color: var(--red); }
.qty span { font-weight: 600; min-width: 22px; text-align: center; font-size: 14px; }

#cartTotal {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px; font-weight: 700;
  margin: 20px 0 16px;
  color: var(--navy);
  display: flex; justify-content: space-between; align-items: baseline;
}
#cartTotal::before {
  content: 'Total';
  font-family: 'Jost', sans-serif;
  font-size: 11px; font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: .4;
}

#btnConfirm {
  width: 100%; padding: 15px;
  border: none; border-radius: 4px;
  background: var(--red); color: white;
  font-weight: 500; font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  font-family: 'Jost', sans-serif;
  transition: .2s;
}
#btnConfirm:hover { background: #a93226; }
#btnConfirm:disabled { background: #ddd; color: #aaa; cursor: not-allowed; }

/* Cart FAB (mobile) */
#cartFab {
  display: none;
  position: fixed; right: 20px; bottom: 20px;
  width: 60px; height: 60px;
  background: var(--navy); color: white;
  border-radius: 50%;
  border: none; cursor: pointer;
  font-size: 22px;
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
  z-index: 999;
  align-items: center; justify-content: center;
  transition: transform .2s;
}
#cartFab:hover { transform: scale(1.06); }
#fabCount {
  position: absolute; top: -2px; right: -2px;
  background: var(--red); color: white;
  font-size: 10px; font-weight: 600;
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}

/* TOAST */
#toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--navy); color: white;
  padding: 13px 24px; border-radius: 6px;
  font-weight: 500; font-size: 13px;
  letter-spacing: 0.3px;
  opacity: 0; transition: .3s; z-index: 9999;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* LOADING */
.skeleton {
  background: linear-gradient(90deg, #f5f5f5 25%, #ebebeb 50%, #f5f5f5 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 8px; height: 280px;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

footer {
  background: var(--navy); color: white;
  padding: 60px; text-align: center;
}
footer .logo { color: white; font-size: 26px; margin-bottom: 12px; }
footer .logo span { color: var(--red); }
footer p { opacity: .4; margin-top: 6px; font-size: 13px; letter-spacing: 1px; font-weight: 300; }

/* RESPONSIVE */
@media(max-width:768px) {
  header { flex-wrap: wrap; gap: 10px; padding: 14px 5%; }
  nav { gap: 16px; }
  nav a { font-size: 11px; }
  .hero h1 { font-size: 56px; letter-spacing: 3px; }
  .hero p { font-size: 11px; }
  section { padding: 70px 5%; }
  .section-title { font-size: 36px; }
  .grid { grid-template-columns: 1fr; }
  #cart { display: none; }
  #cart.mobile-open {
    display: block;
    width: 92%; right: 4%; bottom: 90px;
    max-height: 60vh;
  }
  #cartFab { display: flex; }
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:6px;">
    <div class="logo">KI<span>·</span>ZUNA</div>
    <div id="statusBadge"></div>
  </div>
  <nav>
    <a href="#rolls">Rolls</a>
    <a href="#combos">Combos</a>
    <a href="#veggie">Veggie</a>
    <a href="#bandejas">Bandejas</a>
    <a href="#extras">Extras</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-slide active" style="background-image:url('https://images.unsplash.com/photo-1579871494447-9811cf80d66c')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1617196034183-421b4040ed20')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1611143669185-af224c5e3252')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1562802378-063ec186a863')"></div>
  <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1559410545-0bdcd187e0a6')"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="hero-eyebrow">Alta cocina japonesa artesanal</div>
    <h1>KIZUNA<br>SUSHI</h1>
    <div class="hero-divider"></div>
    <p>Buenos Aires · Argentina</p>
  </div>
</section>

<section id="rolls">
  <div class="section-header">
    <div class="section-title">Rolls</div>
    <span class="section-count" id="rollsCount"></span>
  </div>
  <div class="grid" id="rollsGrid"></div>
</section>

<section id="combos">
  <div class="section-header">
    <div class="section-title">Combos</div>
    <span class="section-count" id="combosCount"></span>
  </div>
  <div class="grid" id="combosGrid"></div>
</section>

<section id="veggie">
  <div class="section-header">
    <div class="section-title">Veggie</div>
    <span class="section-count" id="veggieCount"></span>
  </div>
  <div class="grid" id="veggieGrid"></div>
</section>

<section id="bandejas">
  <div class="section-header">
    <div class="section-title">Bandejas</div>
    <span class="section-count" id="bandejasCount"></span>
  </div>
  <div class="grid" id="bandejasGrid"></div>
</section>

<section id="extras">
  <div class="section-header">
    <div class="section-title">Extras</div>
    <span class="section-count" id="extrasCount"></span>
  </div>
  <div class="grid" id="extrasGrid"></div>
</section>

<!-- CART desktop -->
<div id="cart">
  <div class="cart-header">
    <h2>Tu pedido</h2>
    <span id="cartCount">0</span>
  </div>
  <div id="items"></div>
  <div id="cartTotal">$0</div>
  <button id="btnConfirm" onclick="sendWhatsApp()" disabled>Confirmar por WhatsApp</button>
</div>

<!-- FAB mobile -->
<button id="cartFab" onclick="toggleCartMobile()">
  🛒
  <span id="fabCount">0</span>
</button>

<div id="toast"></div>

<footer>
  <div class="logo">KIZUNA</div>
  <p>Alta cocina japonesa artesanal · Buenos Aires</p>
  <p style="margin-top:6px;">© 2026 Kizuna Sushi</p>
</footer>

<script>
const API = "https://kizuna-api-8ja8.onrender.com";
let products = [], cart = [], settings = {};

/* ── SLIDESHOW ── */
const slides = document.querySelectorAll(".hero-slide");
let currentSlide = 0;
setInterval(() => {
  slides[currentSlide].classList.remove("active");
  currentSlide = (currentSlide + 1) % slides.length;
  slides[currentSlide].classList.add("active");
}, 4500);

/* ── TOAST ── */
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

/* ── LOAD ── */
async function load() {
  ["rollsGrid","combosGrid","veggieGrid","bandejasGrid","extrasGrid"].forEach(id => {
    document.getElementById(id).innerHTML =
      `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  });

  try {
    [products, settings] = await Promise.all([
      fetch(`${API}/products`).then(r => r.json()),
      fetch(`${API}/settings`).then(r => r.json())
    ]);

    updateStatus();
    ["rolls","combos","veggie","bandejas","extras"].forEach(cat => render(cat, cat + "Grid"));

  } catch (err) {
    ["rollsGrid","combosGrid","veggieGrid","bandejasGrid","extrasGrid"].forEach(id => {
      document.getElementById(id).innerHTML =
        `<p class="empty-cat">Error al cargar. Recargá la página.</p>`;
    });
  }
}

/* ── STATUS ── */
function updateStatus() {
  const now = new Date();
  const badge = document.getElementById("statusBadge");

  if (!settings.openDays || !settings.openDays.includes(now.getDay())) {
    badge.textContent = "⛔ Cerrado hoy";
    badge.style.cssText = "background:rgba(192,57,43,.08);color:#C0392B;";
    return;
  }

  const h = now.getHours();
  if (h >= settings.openHour && h < settings.closeHour) {
    badge.textContent = "🟢 Abierto";
    badge.style.cssText = "background:rgba(46,139,87,.1);color:#2e8b57;";
  } else {
    badge.textContent = `🔴Cerrado - Abrimos ${settings.openHour}:00`;
    badge.style.cssText = "background:rgba(192,57,43,.08);color:#C0392B;";
  }
}

/* ── RENDER PRODUCTS ── */
function render(cat, id) {
  const filtered = products.filter(p => p.category === cat);
  const container = document.getElementById(id);
  const countEl = document.getElementById(cat + "Count");

  if (!filtered.length) {
    container.innerHTML = `<p class="empty-cat">Sin productos disponibles por ahora.</p>`;
    if (countEl) countEl.textContent = "";
    return;
  }

  if (countEl) countEl.textContent = `${filtered.length} opciones`;

  container.innerHTML = filtered.map(p => {
    const sinStock = p.stock <= 0;
    return `
    <div class="card">
      <img src="${p.image || 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c'}"
           alt="${p.name}"
           onerror="this.src='https://images.unsplash.com/photo-1579871494447-9811cf80d66c'">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="card-desc">${p.description || ""}</p>
        <div class="card-bottom">
          <div>
            <div class="price">$${p.price.toLocaleString("es-AR")}</div>
            ${sinStock ? `<span class="stock-badge">Sin stock</span>` : ""}
          </div>
          <button class="btn-add"
            onclick='addToCart(${JSON.stringify(p)})'
            ${sinStock ? "disabled" : ""}>
            ${sinStock ? "Agotado" : "Agregar"}
          </button>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* ── CART ── */
function addToCart(p) {
  if (p.stock <= 0) return;
  const found = cart.find(i => i._id === p._id);
  if (found) {
    if (found.qty >= p.stock) { toast("Stock máximo alcanzado"); return; }
    found.qty++;
  } else {
    cart.push({ ...p, qty: 1 });
  }
  updateCart();
  toast(`✓ ${p.name} agregado`);
}

function changeQty(id, delta) {
  const item = cart.find(x => x._id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(x => x._id !== id);
  updateCart();
}

function updateCart() {
  const itemsDiv = document.getElementById("items");
  let total = 0;
  let count = 0;

  if (!cart.length) {
    itemsDiv.innerHTML = `<p style="opacity:.35;font-size:13px;padding:12px 0;letter-spacing:.3px;">Tu carrito está vacío</p>`;
  } else {
    itemsDiv.innerHTML = cart.map(i => {
      const sub = i.price * i.qty;
      total += sub;
      count += i.qty;
      return `
      <div class="cart-item">
        <div>
          <div class="cart-item-name">${i.name}</div>
          <div class="cart-item-sub">$${i.price.toLocaleString("es-AR")} c/u</div>
        </div>
        <div class="qty">
          <button onclick="changeQty('${i._id}',-1)">−</button>
          <span>${i.qty}</span>
          <button onclick="changeQty('${i._id}',1)">+</button>
        </div>
      </div>`;
    }).join("");
  }

  document.getElementById("cartTotal").textContent = `$${total.toLocaleString("es-AR")}`;
  document.getElementById("cartCount").textContent = count;
  document.getElementById("fabCount").textContent = count;
  document.getElementById("btnConfirm").disabled = cart.length === 0;
}

function toggleCartMobile() {
  const c = document.getElementById("cart");
  c.classList.toggle("mobile-open");
}

/* ── WHATSAPP ── */
async function sendWhatsApp() {
  if (!cart.length) return;

  const btn = document.getElementById("btnConfirm");
  btn.disabled = true;
  btn.textContent = "Enviando...";

  let msg = "🍣 Pedido Kizuna%0A%0A";
  let total = 0;
  const snapshot = cart.map(i => ({ _id: i._id, name: i.name, qty: i.qty, price: i.price }));

  snapshot.forEach(i => {
    msg += `• ${i.name} x${i.qty} — $${i.price * i.qty}%0A`;
    total += i.price * i.qty;
  });
  msg += `%0ATotal: $${total}`;

  try {
    const res = await fetch(`${API}/orders`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: snapshot, total })
    });

    if (res.ok) {
      cart = [];
      updateCart();
      location.href = `https://wa.me/5491121734894?text=${msg}`;
    } else {
      const data = await res.json();
      toast(`❌ ${data.error || "Error al registrar el pedido"}`);
      btn.disabled = false;
      btn.textContent = "Confirmar por WhatsApp";
    }
  } catch (err) {
    toast("❌ Error de conexión. Intentá de nuevo.");
    btn.disabled = false;
    btn.textContent = "Confirmar por WhatsApp";
  }
}

load();
</script>

</body>
</html>
