<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizuna Sushi</title>

<style>
body{
font-family:Arial;
background:#faf8f5;
margin:0;
}

header{
padding:25px;
background:#16204a;
color:white;
text-align:center;
font-size:32px;
font-weight:900;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
padding:40px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

img{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#d86a5e;
color:white;
font-weight:700;
cursor:pointer;
}

#cart{
position:fixed;
right:20px;
bottom:20px;
width:300px;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,.12);
}
</style>
</head>
<body>

<header>KIZUNA SUSHI</header>

<div class="grid" id="products"></div>

<div id="cart">
<h2>Pedido</h2>
<div id="items"></div>
<h3 id="total">$0</h3>
<button onclick="sendWhatsApp()">Confirmar</button>
</div>

<script>

const API="https://kizuna-api-8ja8.onrender.com";

let cart=[];
let products=[];

async function load(){

const res=await fetch(`${API}/products`);
products=await res.json();

productsDiv.innerHTML="";

products.forEach(p=>{

productsDiv.innerHTML+=`
<div class="card">
<img src="${p.image}">
<h2>${p.name}</h2>
<p>$${p.price}</p>
<p>Stock: ${p.stock}</p>
<button onclick='addToCart(${JSON.stringify(p)})'>
Agregar
</button>
</div>
`;

});

}

const productsDiv=document.getElementById("products");

function addToCart(p){
cart.push(p);
updateCart();
}

function updateCart(){

items.innerHTML="";
let total=0;

cart.forEach(i=>{
items.innerHTML+=`<p>${i.name} - $${i.price}</p>`;
total+=i.price;
});

document.getElementById("total").innerHTML=`$${total}`;
}

async function sendWhatsApp(){

for(const item of cart){
await fetch(`${API}/buy/${item._id}`,{
method:"POST"
});
}

window.open(
"https://wa.me/1121734894",
"_blank"
);

cart=[];
load();
updateCart();

}

load();

</script>

</body>
</html>
